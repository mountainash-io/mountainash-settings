### config/auth/storage/network/ftp.yaml ###
PROVIDER_TYPE: "ftp"

# Connection Settings
HOST: "ftp.example.com"
PORT: 21
USERNAME: "ftpuser"

# Authentication Settings
AUTH_METHOD: "password"
PASSWORD: "your_password"
# ACCOUNT: "account_info"  # For systems requiring account info

# Security Settings
USE_TLS: true
TLS_MODE: "explicit"  # explicit or implicit
VERIFY_SSL: true
# CA_CERTS: "/path/to/ca-certs"
# CERT_FILE: "/path/to/cert.pem"
# KEY_FILE: "/path/to/key.pem"
CHECK_HOSTNAME: true

# Connection Mode Settings
MODE: "passive"
ENABLE_IPV6: false
# PASSIVE_PORTS: [60000, 60001, 60002]
# ACTIVE_PORTS: [60010, 60011, 60012]

# Transfer Settings
DATA_TYPE: "binary"  # ascii, binary, ebcdic
ENCODING: "utf-8"
BUFFER_SIZE: 8192  # 8KB

# Path Settings
# ROOT_PATH: "/path/on/server"
# DEFAULT_PATH: "/path/on/server/default"

# Timeout Settings
CONNECT_TIMEOUT: 30.0
DATA_TIMEOUT: 30.0
# KEEPALIVE_INTERVAL: 60