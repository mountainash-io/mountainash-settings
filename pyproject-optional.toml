[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mountainash_settings"
dynamic = ["version"]
description = 'Mountain Ash - Settings'
readme = "README.md"
requires-python = ">=3.10"
# license = "Proprietary"
keywords = ["settings", "secrets", "cloud", "security"]
authors = [
    { name = "Nathaniel Ramm", email = "nathaniel.ramm@discretedatascience.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "pydantic==2.9.2",
    "pydantic-settings==2.6.1",
    "universal_pathlib==0.2.2",
    "cryptography>=42.0.0",
    "keyring>=24.3.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34.0", "botocore>=1.34.0"]
azure = [
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-core>=1.30.0",
]
gcp = [
    "google-cloud-secret-manager>=2.18.0",
    "google-auth>=2.28.0",
    "google-api-core>=2.17.0",
]
vault = ["hvac>=2.1.0"]
all = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "azure-identity>=1.15.0",
    "azure-keyvault-secrets>=4.8.0",
    "azure-core>=1.30.0",
    "google-cloud-secret-manager>=2.18.0",
    "google-auth>=2.28.0",
    "google-api-core>=2.17.0",
    "hvac>=2.1.0",
]

[project.urls]
Documentation = "https://github.com/mountainash-io/mountainash-settings#readme"
Issues = "https://github.com/mountainash-io/mountainash-settings/issues"
Source = "https://github.com/mountainash-io/mountainash-settings"

[tool.coverage.run]
source_pkgs = ["mountainash_settings", "tests"]
branch = true
parallel = true
omit = ["src/mountainash_settings/__version__.py"]

[tool.coverage.paths]
mountainash_settings = [
    "src/mountainash_settings",
    "*/mountainash-settings/src/mountainash_settings",
]
tests = ["tests", "*/mountainash-settings/tests"]

[tool.coverage.report]
exclude_lines = ["no cov", "if __name__ == .__main__:", "if TYPE_CHECKING:"]
