# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Mountainash Settings'
site_description: 'An intelligent textbook for mountainash-settings — a typed configuration framework for Python applications'
site_author: 'Nathaniel Ramm'
site_url: 'https://mountainash-io.github.io/mountainash-settings/'

# Hooks — runs local Python before/after page processing
# social_override.py lets per-page `image:` frontmatter override the auto-
# generated social card URL for og:image and twitter:image meta tags.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/mountainash-io/mountainash-settings'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Nathaniel Ramm. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - 1. Pydantic and Configuration Foundations: chapters/01-pydantic-and-configuration-foundations/index.md
      - 2. MountainAsh Base Settings: chapters/02-mountainash-base-settings/index.md
      - 3. Settings Parameters and Merge Strategies: chapters/03-settings-parameters-and-merge-strategies/index.md
      - 4. File Handling, Kwargs, and Field Templating: chapters/04-file-handling-kwargs-and-field-templating/index.md
      - 5. Secrets Resolution: chapters/05-secrets-resolution/index.md
      - 6. Connection Profiles: chapters/06-connection-profiles/index.md
      - 7. Profile Registry and Invariants: chapters/07-profile-registry-and-invariants/index.md
      - 8. Authentication System: chapters/08-authentication-system/index.md
      - 9. Caching, Settings Management, and App Settings: chapters/09-caching-settings-management-and-app-settings/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      # Generated by learning-graph-generator skill:
      # - Course Description Assessment: learning-graph/course-description-assessment.md
      # - Concept Enumeration: learning-graph/concept-list.md
      # - Concept Taxonomy: learning-graph/concept-taxonomy.md
      # - Graph Quality Analysis: learning-graph/quality-metrics.md
      # - Taxonomy Distribution: learning-graph/taxonomy-distribution.md

  - MicroSims:
      - List of MicroSims: sims/index.md

  - API Reference:
      - Overview: api/index.md
      - Profiles: api/profiles.md
      - Secrets: api/secrets.md
      - Settings: api/settings.md
      - Settings Cache: api/settings_cache.md
      - Settings Parameters: api/settings_parameters.md
      - Resolve: api/resolve.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    primary: 'deep-orange'
    accent: 'amber'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: ["../../../mountainash-settings/src"]
          options:
            show_source: true
            show_bases: true
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css

# Custom JavaScript — uncomment once a corresponding file exists
# extra_javascript:
#   - js/extra.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | approved
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Mountainash Settings'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
