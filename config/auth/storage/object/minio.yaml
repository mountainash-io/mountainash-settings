### config/auth/storage/object/minio.yaml ###
PROVIDER_TYPE: "minio"

# Connection Settings
ENDPOINT: "play.min.io"
PORT: 443
BUCKET: "mybucket"
SECURE: true

# Authentication Settings
ACCESS_KEY: "minioadmin"
SECRET_KEY: "minioadmin"

# Client Settings
REGION: "us-east-1"
# HTTP_CLIENT: "custom_client"

# Security Settings
USE_SSL: true
VERIFY_SSL: true
CERT_VERIFY: true
# CA_PATH: "/path/to/ca.pem"

# Performance Settings
BUFFER_SIZE: 16384  # 16KB
MAX_WRITE_SIZE: 1048576  # 1MB
MAX_READ_SIZE: 1048576  # 1MB

# Connection Settings
TIMEOUT: 60.0
KEEPALIVE: true
KEEPALIVE_INTERVAL: 30
CONN_POOL_SIZE: 10
RETRY_COUNT: 3

# Advanced Settings
# HTTP_CLIENT: "custom_client"
RETENTION_MODE: "COMPLIANCE"  # COMPLIANCE or GOVERNANCE
RETENTION_DURATION: 30  # days