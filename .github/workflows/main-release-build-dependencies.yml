# Pre-merge validation workflow
name: Validate Main Release PR - Build Dependencies

on:
  pull_request:
    branches:
      - "main"

permissions:
  contents: read

jobs:
  main-release-build-dependencies:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]

    env:
      BUILD_ENV: "build_github"

    steps:
      # ======================================================
      # INITIALIZE

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0 # Get the target branch name (branch PR was merged into)
          persist-credentials: false

      - name: Set Branch Vars
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Git refs cannot contain newlines, so these cannot inject extra env entries.
          printf 'SOURCE_BRANCH=%s\n' "$HEAD_REF" >> "$GITHUB_ENV"
          printf 'TARGET_BRANCH=%s\n' "$BASE_REF" >> "$GITHUB_ENV"

      # ======================================================
      # DEPENDENCIES

      - name: Python Dependencies
        run: |
          pip install hatchling==1.29.0
          pip install hatch==1.16.5

      # ======================================================
      # BUILD ARTIFACTS

      - name: Setup Build Environment
        run: |
          hatch env create "$BUILD_ENV"
