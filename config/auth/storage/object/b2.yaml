aml ###
PROVIDER_TYPE: "b2"

# Authentication Settings
APPLICATION_KEY_ID: "your_key_id"
APPLICATION_KEY: "your_application_key"

# Bucket Settings
BUCKET_NAME: "my-bucket"
BUCKET_ID: "bucket_id"  # Optional, can be looked up
BUCKET_TYPE: "allPrivate"  # allPublic, allPrivate, snapshot

# Endpoint Settings
API_ENDPOINT: "api.backblazeb2.com"
# DOWNLOAD_ENDPOINT: "auto-discovered"

# Encryption Settings
SERVER_SIDE_ENCRYPTION: "SSE-B2"  # none, SSE-B2, SSE-C
# CUSTOMER_KEY: "your_customer_key"  # For SSE-C
# KEY_ID: "encryption_key_id"

# Lifecycle Settings
FILE_RETENTION_DAYS: 30
FILE_PREFIX: "backup/"
DELETE_OLD_VERSIONS: false
KEEP_LAST_N_VERSIONS: 3

# Performance Settings
RECOMMENDED_PART_SIZE: 104857600  # 100MB
MIN_PART_SIZE: 5242880  # 5MB
MAX_CONNECTIONS: 4

# Cache Settings
AUTH_CACHE_TTL: 86400  # 24 hours
UPLOAD_URL_CACHE_TTL: 1800  # 30 minutes

# Rate Limiting
MAX_RETRIES: 5
RETRY_BACKOFF_FACTOR: 1.5
MIN_RETRY_DELAY: 1.0
MAX_RETRY_DELAY: 60.0

# CORS Settings
# ALLOWED_ORIGINS: ["https://example.com"]
# ALLOWED_OPERATIONS: ["b2_download_file_by_id"]
# EXPOSE_HEADERS: ["x-bz-content-sha1"]
MAX_AGE_SECONDS: 3600

# Capabilities
CAPABILITIES:
  - "listFiles"
  - "readFiles"
  - "writeFiles"