name: Pytest

on:
  push:
    branches: [develop, main]
  pull_request:
    paths:
      - "src/mountainash_settings/**"
      - "tests/**"
      - "examples/**"
      - "README.md"
      - "pyproject.toml"
      - "hatch.toml"
      - ".github/workflows/python-run-pytest.yml"
  workflow_dispatch:
    inputs:
      fallback_branch:
        description: "Fallback branch to use"
        required: true
        default: "develop"
        type: choice
        options:
          - develop
          - main

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python-version: ["3.12"]

    steps:
      - name: Set fallback branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "FALLBACK_BRANCH=${{ github.event.inputs.fallback_branch }}" >> $GITHUB_ENV
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "FALLBACK_BRANCH=${{ github.base_ref }}" >> $GITHUB_ENV
          else
            echo "FALLBACK_BRANCH=develop" >> $GITHUB_ENV
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: pip install hatch

      - name: Create virtual environment
        run: hatch env create test_github

      - name: Run Coverage Tests
        run: hatch run test_github:test-cov

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          fail_ci_if_error: true
          files: ./coverage.xml
          disable_search: true
          verbose: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@v1
        with:
          use_oidc: true
          fail_ci_if_error: true
          files: ./junit.xml
          disable_search: true
