### config/auth/storage/network/nfs.yaml ###
PROVIDER_TYPE: "nfs"

# Server Settings
SERVER: "nfs.example.com"
EXPORT_PATH: "/exports/share"

# Protocol Settings
VERSION: "4.2"  # 3, 4, 4.1, 4.2
MOUNT_PROTOCOL: "tcp"  # udp, tcp, rdma

# Security Settings
SECURITY_TYPE: "sys"  # sys, krb5, krb5i, krb5p
USE_KERBEROS: false
# KERBEROS_KDC: "kdc.example.com"
# KERBEROS_REALM: "EXAMPLE.COM"
# KERBEROS_PRINCIPAL: "nfs/client.example.com"
# KERBEROS_KEYTAB: "/etc/krb5.keytab"

# ID Mapping Settings
# LOCAL_UID: 1000
# LOCAL_GID: 1000
# UID_MAPPING: {0: 1000, 1: 1001}
# GID_MAPPING: {0: 1000, 1: 1001}

# Mount Options
READ_ONLY: false
NO_LOCK: false
HARD_MOUNT: true
RETRY_COUNT: 3
TIMEOUT: 600
RETRANS: 3
ACREGMIN: 3
ACREGMAX: 60
ACDIRMIN: 30
ACDIRMAX: 60

# Performance Settings
RW_SIZE: 1048576  # 1MB
READ_AHEAD: 1
WRITE_BACK_CACHE: false
ASYNC: false

# Advanced Settings
# MOUNT_POINT: "/mnt/nfs"
NO_DEV: true
NO_SUID: true
NO_EXEC: false