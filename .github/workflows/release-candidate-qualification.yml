name: Settings App Cache Native Verification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022]
        python: ['3.12', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 36805956372
          name: settings-local-store-${{ runner.os }}
          path: ${{ runner.temp }}/existing-native-proof
      - name: Verify existing installed artifacts
        shell: bash
        run: python -I tools/verify_app_cache_native.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-cache-${{ runner.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/app-cache-proof
