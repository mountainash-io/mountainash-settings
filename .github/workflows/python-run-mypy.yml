name: Production typing
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  mypy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install hatch
      - run: hatch run mypy:check
  installed-consumer:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install hatch
      - run: hatch run mypy:qualify --output "${{ runner.temp }}/typing-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typing-evidence-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/typing-evidence/*.log
            ${{ runner.temp }}/typing-evidence/receipt.json
            ${{ runner.temp }}/typing-evidence/direct/*
            ${{ runner.temp }}/typing-evidence/rebuilt/*
