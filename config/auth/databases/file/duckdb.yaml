### config/auth/database/file/duckdb.yaml ###
PROVIDER_TYPE: "duckdb"
DATABASE_PATH: "/path/to/my.db"
READ_ONLY: false
MEMORY: false

# Configuration Settings
THREADS: 4
MEMORY_LIMIT: "4GB"
# TEMP_DIRECTORY: "/path/to/temp"

# Extension Settings
EXTENSIONS:
  - "json"
  - "httpfs"
ALLOW_UNSIGNED_EXTENSIONS: false

# Performance Settings
# PAGE_SIZE: 16384
COMPRESSION: "auto"
# ACCESS_MODE: "AUTOMATIC"