### config/auth/storage/cloud/azure_files.yaml ###
PROVIDER_TYPE: "azure_files"

# Azure Settings
ACCOUNT_NAME: "mystorageaccount"
SHARE_NAME: "myfileshare"

# Authentication Settings
AUTH_METHOD: "key"  # key, managed_identity, token
ACCOUNT_KEY: "your_account_key"
# CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=mystorageaccount;AccountKey=your_account_key;EndpointSuffix=core.windows.net"
# SAS_TOKEN: "your_sas_token"

# AAD Settings
# TENANT_ID: "your_tenant_id"
# CLIENT_ID: "your_client_id"
# CLIENT_SECRET: "your_client_secret"

# Endpoint Settings
ENDPOINT_SUFFIX: "core.windows.net"
# CUSTOM_DOMAIN: "custom.domain.com"

# SMB Settings
SMB_VERSION: "3.0"  # 2.1, 3.0, 3.1.1
SMB_ENCRYPTION: true
SMB_CONTINUOUS_AVAILABILITY: true
SMB_MULTICHANNEL: true

# Performance Settings
MAX_RANGE_SIZE: 4194304  # 4 MB
MAX_SINGLE_GET_SIZE: 33554432  # 32 MB
ENABLE_WRITE_BUFFERING: true
WRITE_BUFFER_SIZE: 4194304  # 4 MB

# Security Settings
REQUIRE_ENCRYPTION: true
HTTPS_ONLY: true
ENABLE_KERBEROS: false
# KERBEROS_TICKET_PATH: "/path/to/ticket"