name: Production typing
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  mypy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install hatch==1.16.5
      - run: hatch run mypy:check
  installed-consumer:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install hatch==1.16.5
      - run: hatch run mypy:qualify --output "${{ runner.temp }}/typing-evidence"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: typing-evidence-${{ matrix.python }}
          path: |
            ${{ runner.temp }}/typing-evidence/*.log
            ${{ runner.temp }}/typing-evidence/receipt.json
            ${{ runner.temp }}/typing-evidence/direct/*
            ${{ runner.temp }}/typing-evidence/rebuilt/*
